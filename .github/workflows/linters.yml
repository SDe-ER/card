name: Linters

on:
  pull_request: {}
  # weekly and manual runs scan the whole repository: with no pull request there is
  # no merge base, so `semgrep ci` scans every git-tracked file instead of the diff
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit (ruff, prettier)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # the steps of pre-commit/action@v3.0.1, whose internal actions/cache@v4 runs on Node 20 (#62)
      - name: Install pre-commit
        run: |
          python -m pip install pre-commit
          python -m pip freeze --local
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: pre-commit run --show-diff-on-failure --color=always --all-files

  semgrep:
    name: Semgrep (Frappe rules)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install semgrep
        run: pip install semgrep
      - name: Download Frappe semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules
      # --no-suppress-errors: semgrep ci otherwise exits 0 when a config fails to load
      - name: Run semgrep
        run: semgrep ci --metrics=off --no-suppress-errors --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness
