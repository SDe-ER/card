name: CI

on:
  push:
    branches:
      - main
      - version-16
  pull_request:
    paths-ignore:
      - "**.md"
      - ".github/images/**"
      - "LICENSE"
      - "license.txt"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: CARD unit tests (frappe version-16 / 16.5x)

    services:
      mariadb:
        image: mariadb:10.6  # match production (MariaDB 10.6.27) and the README
        env:
          MARIADB_ROOT_PASSWORD: "root"
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=2s --health-retries=5

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}

      - name: Add test site to hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Install bench, frappe, erpnext and CARD
        env:
          FRAPPE_BRANCH: version-16
          ERPNEXT_BRANCH: version-16
        run: bash ${GITHUB_WORKSPACE}/.github/helper/install.sh

      - name: Run CARD tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-tests --app card --coverage

      - name: Show error log on failure
        if: failure()
        working-directory: /home/runner/frappe-bench
        run: cat sites/test_site/logs/*.log 2>/dev/null || true
