name: CI

on:
  push:
    branches:
      - main
      - version-16
  pull_request: {}  # no path filter: the required unit-test check must also report on docs-only PRs (#37)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19 (#62)
    timeout-minutes: 45
    name: CARD unit tests (frappe version-16 / 16.5x)

    services:
      mariadb:
        image: mariadb:10.6  # match production (MariaDB 10.6.27) and the README
        env:
          MARIADB_ROOT_PASSWORD: "root"
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=2s --health-retries=5

    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}

      - name: Add test site to hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Install bench, frappe, erpnext and CARD
        env:
          FRAPPE_BRANCH: version-16
          ERPNEXT_BRANCH: version-16
        run: bash ${GITHUB_WORKSPACE}/.github/helper/install.sh

      - name: Run CARD tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-tests --app card --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: /home/runner/frappe-bench/sites/coverage.xml  # bench runs frappe commands from sites/
          disable_search: true
          fail_ci_if_error: false

      - name: Show error log on failure
        if: failure()
        working-directory: /home/runner/frappe-bench
        run: cat sites/test_site/logs/*.log 2>/dev/null || true

  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: CARD Mobile (type check, unit tests, build)
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Type check
        run: yarn type-check

      - name: Unit tests
        run: yarn test

      - name: Build
        run: yarn build

      - name: Check the build output
        working-directory: .
        run: |
          test -f card/public/frontend/sw.js
          test -f card/public/frontend/manifest.webmanifest
          test -f card/www/cdms.html
          grep -q '"scope":"/cdms/"' card/public/frontend/manifest.webmanifest
