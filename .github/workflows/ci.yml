name: CI

on:
  push:
    branches:
      - version-16
      - develop
      - master
  pull_request:
    branches:
      - version-16
      - develop
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        # Environment-specific: repository must ship a .pre-commit-config.yaml
        # (ruff, eslint, prettier, pyupgrade per README).

  tests:
    name: Frappe v16 Tests
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:6
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout card into a subdir (kept separate from frappe-bench)
        uses: actions/checkout@v4
        with:
          path: card-src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install frappe-bench
        run: pip install frappe-bench

      - name: Init bench (Frappe version-16)
        # Environment-specific: frappe-branch matches this app's target branch.
        run: bench init --skip-redis-config-generation --frappe-branch version-16 frappe-bench

      - name: Get ERPNext (card links to Company/Supplier/Project)
        working-directory: frappe-bench
        run: bench get-app --branch version-16 erpnext

      - name: Get the card app (from the checked-out source)
        working-directory: frappe-bench
        run: bench get-app "${{ github.workspace }}/card-src"

      - name: Create test site
        # Environment-specific: DB credentials/host reflect the service container above.
        working-directory: frappe-bench
        run: >-
          bench new-site test_site
          --mariadb-root-password root
          --admin-password admin
          --no-mariadb-socket

      - name: Install apps (ERPNext first, then card)
        working-directory: frappe-bench
        run: |
          bench --site test_site install-app erpnext
          bench --site test_site install-app card

      - name: Run card tests
        working-directory: frappe-bench
        run: bench --site test_site run-tests --app card

  security:
    name: Security (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Note: Semgrep and Trivy scans are run separately (outside this workflow).
